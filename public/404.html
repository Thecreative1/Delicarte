<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Página não encontrada | Delicarte</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        min-height: 100vh;
        background: #fbfaf7;
        color: #252621;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
        display: flex;
        flex-direction: column;
      }
      header {
        border-bottom: 1px solid #e5e0d7;
        padding: 1.25rem 2rem;
      }
      header a {
        font-family: Georgia, "Times New Roman", serif;
        font-size: 1.25rem;
        letter-spacing: 0.12em;
        color: #252621;
        text-decoration: none;
      }
      main {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 3rem 1.5rem;
      }
      .kicker {
        font-size: 0.75rem;
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: 0.24em;
        color: #7f816e;
        margin-bottom: 1.5rem;
      }
      h1 {
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(2.5rem, 8vw, 4.5rem);
        line-height: 1;
        color: #252621;
        margin-bottom: 1.5rem;
      }
      p {
        font-size: 1rem;
        font-weight: 300;
        line-height: 2;
        color: #4f5147;
        max-width: 36rem;
        margin-bottom: 2.5rem;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        justify-content: center;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 3rem;
        padding: 0 1.75rem;
        font-size: 0.75rem;
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: 0.16em;
        text-decoration: none;
        border: 1px solid;
        transition: background 0.3s, border-color 0.3s;
      }
      .btn-primary {
        background: #6f755c;
        border-color: #6f755c;
        color: #ffffff;
      }
      .btn-primary:hover { background: #5e644e; border-color: #5e644e; }
      .btn-secondary {
        background: rgba(255,255,255,0.42);
        border-color: #d6d0c5;
        color: #252621;
      }
      .btn-secondary:hover { background: rgba(255,255,255,0.7); border-color: #6f755c; }
      footer {
        border-top: 1px solid #e5e0d7;
        padding: 1.5rem 2rem;
        text-align: center;
        font-size: 0.75rem;
        color: #7f816e;
      }
    </style>
  </head>
  <body>
    <header>
      <a href="/">Delicarte</a>
    </header>
    <main>
      <p class="kicker">Erro 404</p>
      <h1>Página não encontrada</h1>
      <p>Esta página não existe ou foi movida. Pode voltar à página inicial ou falar diretamente com a Raquel pelo WhatsApp para marcar a sua sessão.</p>
      <div class="actions">
        <a class="btn btn-primary" href="https://wa.me/351917968714?text=Ol%C3%A1%20Raquel%2C%20gostaria%20de%20marcar%20uma%20sess%C3%A3o%20na%20Delicarte.">Marcar pelo WhatsApp</a>
        <a class="btn btn-secondary" href="/">Voltar ao início</a>
      </div>
    </main>
    <footer>
      © 2026 Delicarte by Raquel Oliveira
    </footer>
  </body>
</html>
